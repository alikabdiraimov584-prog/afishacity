# Reverse proxy для FREE. Замените YOUR_DOMAIN на свой домен.
# sudo cp deploy/nginx.conf /etc/nginx/sites-available/free && sudo ln -s /etc/nginx/sites-available/free /etc/nginx/sites-enabled/
# TLS выпускает certbot: sudo certbot --nginx -d YOUR_DOMAIN
server {
    listen 80;
    server_name YOUR_DOMAIN;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
